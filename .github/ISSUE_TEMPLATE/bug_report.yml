name: Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/EvanTrow/Jellyfin-Certbot/issues) first to avoid duplicates.

        > [!WARNING]
        > **Never post your DNS provider API token, the PEM account key, or certificate files/passwords.** Redact them from logs, config, and screenshots.
        > Security vulnerabilities should be reported privately via the [Security tab](https://github.com/EvanTrow/Jellyfin-Certbot/security/advisories/new), not here.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the domain, email, and DNS provider in the plugin settings
        2. Run the "Renew SSL Certificate" scheduled task
        3. ...
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown under Dashboard → Plugins.
      placeholder: e.g. 1.1.0.0
    validations:
      required: true

  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version
      placeholder: e.g. 12.4.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is Jellyfin installed?
      options:
        - Docker
        - Windows
        - Linux (package)
        - macOS
        - Other
    validations:
      required: true

  - type: dropdown
    id: dns-provider
    attributes:
      label: DNS provider
      options:
        - Cloudflare
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Certificate request / renewal task
        - DNS challenge record (Cloudflare)
        - Let's Encrypt / ACME account
        - Jellyfin HTTPS settings not applied
        - Plugin configuration page
        - Installation / plugin repository
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Jellyfin log lines mentioning `Certbot`, `CertbotRenew`, or `Cloudflare` around the time of the problem. **Redact any tokens or keys.** This is automatically formatted as code.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, configuration details (redacted), anything else that might help.

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: I removed all secrets (API tokens, PEM key, certificate passwords) from this report.
          required: true
